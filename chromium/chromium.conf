; Replaces the image's /etc/neko/supervisord/chromium.conf (mounted read-only by docker-compose.yml).
; Differences from Neko's stock file:
;   - no --no-sandbox: Chromium runs its own sandbox (needs cap_add SYS_ADMIN in docker-compose.yml)
;   - --load-extension loads your extension from /opt/extensions/genesis (a read-only mount)
;   - --extensions-update-frequency: check hourly for a new guard extension (default is every 5 hours)
;   - starts through start-chromium.sh, which first clears stale extension background-script
;     registrations so a changed extension always runs its current code
; After editing this file run: docker compose up -d --force-recreate neko

[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/bin/sh /opt/neko-patches/start-chromium.sh
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/.config/chromium
  --no-first-run
  --start-maximized
  --bwsi
  --force-dark-mode
  --disable-file-system
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
  --load-extension=/opt/extensions/genesis
  --extensions-update-frequency=3600
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
